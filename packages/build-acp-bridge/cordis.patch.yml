# Native Grok Build ACP bridge. Authentication remains owned by the official
# `grok` CLI; this bundle never reads or copies ~/.grok/auth.json.
- insert:
    - id: subagent-build-native
      name: 'dsh-build-acp-bridge'
      config:
        providerName: build-native
        command: grok
        args:
          - agent
          - stdio
        permission: reject
        env: {}
        disposeEofGraceMs: 6000
        disposeGraceMs: 3000

# Media-only lane. Grok auto-approves only the four explicitly allowlisted
# first-party Imagine tools; shell, edit, write, MCP, and publishing tools are
# absent from this child process.
- insert:
    - id: subagent-build-media
      name: 'dsh-build-acp-bridge'
      config:
        providerName: build-media
        command: grok
        args:
          - --tools
          - image_gen,image_edit,image_to_video,reference_to_video
          - --always-approve
          - agent
          - stdio
        permission: allow
        env: {}
        disposeEofGraceMs: 6000
        disposeGraceMs: 3000
